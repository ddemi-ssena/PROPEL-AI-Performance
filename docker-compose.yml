services:
  db:
    image: pgvector/pgvector:pg15
    container_name: propel_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: propel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./propel-backend
      dockerfile: Dockerfile
    container_name: propel_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./propel-backend:/app
    ports:
      - "8001:8000"
    env_file:
      - ./propel-backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:123456@db:5432/propel_db
      SECRET_KEY: 123456
    depends_on:
      - db

  frontend:
    build:
      context: ./propel-frontend
      dockerfile: Dockerfile
    container_name: propel_frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./propel-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8001/api/v1"
    depends_on:
      - backend

volumes:
  postgres_data:
